<title>Nethera Topology Options</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: option tabs, one live stage with shared sample network, notes below. Single dark look = Nethera app palette. */
:root {
  --bg-main: #212121; --card: #001818; --accent: #63e5c5; --accent-2: #144659;
  --text: #e5ebe7; --soft: rgba(229,235,231,.72); --faint: rgba(229,235,231,.45); --line: rgba(229,235,231,.10);
  --on: #5fd08a;
  --f-ui: "Inter", "Segoe UI", system-ui, sans-serif;
  --f-head: "Space Grotesk", "Inter", sans-serif;
  --f-app: "Avenir Next", "Segoe UI", "Inter", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg-main); }
body {
  color: var(--text); font: 14px/1.5 var(--f-ui);
  background: radial-gradient(ellipse 900px 460px at 12% 0%, rgba(99,229,197,.08), transparent 70%), var(--bg-main);
  -webkit-font-smoothing: antialiased;
}
.page { max-width: 1280px; margin: 0 auto; padding-block: 28px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; }
header h1 { font: 600 28px/1.15 var(--f-head); margin: 4px 0 6px; text-wrap: balance; }
header p { margin: 0; color: var(--soft); max-width: 70ch; }
.eyebrow { color: var(--accent); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

.tabs { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.tab { text-align: left; border: 1px solid var(--line); background: rgba(0,24,24,.45); border-radius: 12px; padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
.tab:hover { border-color: rgba(99,229,197,.35); }
.tab[aria-selected="true"] { border-color: var(--accent); background: rgba(99,229,197,.09); }
.tab .k { font: 600 12px var(--f-head); color: var(--accent); letter-spacing: .06em; }
.tab .n { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tab .s { font-size: 12px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; padding: 3px; background: rgba(0,24,24,.35); }
.seg button { border: 0; background: transparent; padding: 7px 12px; border-radius: 7px; color: var(--soft); }
.seg button[aria-pressed="true"] { background: rgba(99,229,197,.12); color: var(--accent); }
.toggle { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: rgba(0,24,24,.35); border-radius: 10px; padding: 8px 12px; color: var(--soft); }
.toggle[aria-pressed="true"] { border-color: var(--accent); color: var(--text); background: rgba(99,229,197,.08); }
.toggle i { width: 9px; height: 9px; border-radius: 50%; background: var(--on); }
.controls .hint { color: var(--faint); font-size: 12px; margin-left: auto; }

#stage { position: relative; height: clamp(540px, 74vh, 720px); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; font-family: var(--f-app); user-select: none; -webkit-user-select: none; }

.notes { display: grid; grid-template-columns: 1.1fr 1fr 1fr; gap: 14px; }
.note { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; background: rgba(0,24,24,.35); min-width: 0; }
.note h2 { font: 600 17px var(--f-head); margin: 0 0 4px; }
.note h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--faint); margin: 0 0 8px; font-weight: 600; }
.note p { margin: 0; color: var(--soft); }
.note ul { margin: 0; padding-left: 18px; color: var(--soft); display: grid; gap: 4px; }
.note .origin { font-size: 12px; color: var(--accent); margin-bottom: 8px; }
.note .effort { margin-top: 10px; font-size: 12px; color: var(--faint); }
.note .effort b { color: var(--text); font-weight: 600; }
.plus li::marker { content: "+  "; color: var(--accent); }
.minus li::marker { content: "–  "; color: #e0a96d; }

/* ---------- shared detail card (D, E, F) ---------- */
.detail { position: absolute; top: 14px; right: 14px; width: 250px; z-index: 40; background: rgba(0,24,24,.93); border: 1px solid var(--line); border-radius: 12px; padding: 14px; backdrop-filter: blur(6px); font-size: 13px; }
.detail .x { position: absolute; top: 8px; right: 8px; border: 0; background: transparent; color: var(--faint); width: 28px; height: 28px; border-radius: 6px; font-size: 18px; line-height: 1; }
.detail .x:hover { background: rgba(229,235,231,.08); }
.detail .kick { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--accent); }
.detail h4 { margin: 2px 0 10px; font-size: 17px; padding-right: 24px; }
.detail dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; }
.detail dt { color: var(--faint); }
.detail dd { margin: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--g); margin-right: 6px; vertical-align: -1px; }
.st-on { color: var(--on); } .st-off { color: var(--faint); }

/* ---------- A + C: classic DOM topology ---------- */
.cold { background: radial-gradient(ellipse at 50% 48%, rgba(20,70,89,.23), transparent 62%), #212121; }
.cmod { background: radial-gradient(circle, rgba(229,235,231,.035) 1px, transparent 1px) 0 0 / 26px 26px, #1f2222; }
.c-lines { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
.c-lines line { stroke-linecap: round; }
.cold .c-lines line { stroke: var(--accent); stroke-width: 1.35; stroke-opacity: .36; }
.c-router { position: absolute; transform: translate(-50%, -50%); z-index: 10; opacity: .93; pointer-events: none;
  filter: drop-shadow(0 12px 22px rgba(0,0,0,.48)) drop-shadow(0 0 24px rgba(99,229,197,.42)) drop-shadow(0 0 44px rgba(99,229,197,.22)); }
.c-group { position: absolute; z-index: 12; touch-action: none; cursor: grab; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 12px; border-radius: 999px; font-weight: 700; font-size: 14px; letter-spacing: .03em; color: var(--text); white-space: nowrap; overflow: hidden; transition: transform .18s ease, box-shadow .18s ease, opacity .2s; }
.cold .c-group { background: linear-gradient(135deg, rgba(20,70,89,.9), rgba(99,229,197,.75)); border: 1px solid rgba(99,229,197,.45); }
.c-group:hover { transform: translateY(-4px) scale(1.02); box-shadow: 0 8px 18px rgba(0,0,0,.35); }
.c-dev { position: absolute; z-index: 14; touch-action: none; cursor: pointer; border-radius: 50%; transition: transform .18s ease, box-shadow .18s ease, opacity .2s; }
.cold .c-dev { background: radial-gradient(circle at 30% 28%, var(--text), var(--accent) 28%, var(--accent-2) 95%); border: 1px solid rgba(99,229,197,.9); box-shadow: 0 0 0 5px rgba(99,229,197,.10), 0 0 20px rgba(99,229,197,.42); }
.cold .c-dev:hover { transform: translateY(-3px) scale(1.08); box-shadow: 0 0 0 7px rgba(99,229,197,.16), 0 0 28px rgba(99,229,197,.6); }
.cold .c-dev.sel { transform: scale(1.05); box-shadow: 0 0 0 7px rgba(99,229,197,.18), 0 0 30px rgba(99,229,197,.7); }
.c-info { position: absolute; z-index: 16; pointer-events: none; background: rgba(0,24,24,.96); border: 1px solid rgba(99,229,197,.22); padding: 8px 10px; border-radius: 10px; box-shadow: 0 8px 20px rgba(0,0,0,.32); font-size: 13px; line-height: 1.25; width: max-content; max-width: 230px; }
.cold .c-info { opacity: 0; transform: translateY(3px); transition: opacity .15s ease, transform .15s ease; }
.cold .c-info.show { opacity: .98; transform: none; }
.c-info b { display: block; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-info span { display: block; color: var(--soft); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-bar { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); width: min(960px, calc(100% - 28px)); min-height: 42px; padding: 4px 6px; z-index: 30; display: flex; align-items: center; gap: 8px; background: rgba(0,24,24,.9); border: 1px solid var(--line); border-radius: 999px; color: var(--soft); font-size: 13px; backdrop-filter: blur(3px); }
.c-bar > button { width: 34px; height: 30px; flex: none; border: 0; border-radius: 999px; font-weight: 700; color: var(--text); background: linear-gradient(135deg, var(--accent-2), var(--accent)); }
.c-bar .d { flex: 1; min-width: 0; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-bar b { color: var(--accent); }
.c-reset { position: absolute; top: 14px; right: 14px; z-index: 30; border: 1px solid rgba(229,235,231,.16); border-radius: 7px; background: var(--card); padding: 9px 14px; font-weight: 700; }
.c-reset:hover { transform: translateY(-1px); }

.cmod .c-group { font-size: 13px; letter-spacing: .02em; background: linear-gradient(135deg, color-mix(in srgb, var(--g) 38%, #144659), rgba(20,70,89,.88)); border: 1px solid color-mix(in srgb, var(--g) 65%, transparent); }
.cmod .c-group small { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: rgba(0,0,0,.28); color: var(--soft); }
.cmod .c-group.act { outline: 2px solid var(--g); outline-offset: 3px; }
.cmod .c-dev { background: radial-gradient(circle at 30% 28%, #f2f6f4, var(--g) 30%, color-mix(in srgb, var(--g) 40%, #0b1d22) 95%); border: 1px solid var(--g); box-shadow: none; }
.cmod .c-dev:hover { box-shadow: 0 0 0 2px var(--g); }
.cmod .c-dev.sel { transform: scale(1.15); box-shadow: 0 0 0 2px #1f2222, 0 0 0 4px #e5ebe7; }
.cmod .c-router { filter: drop-shadow(0 10px 16px rgba(0,0,0,.45)); }
.cmod .dot { box-shadow: none; }
.cmod .c-dev.off { background: #1f2222; border: 1.5px dashed rgba(229,235,231,.38); box-shadow: none; }
.cmod .c-dev.off.sel { border-color: var(--g); box-shadow: 0 0 0 3px #1f2222, 0 0 0 5px #e5ebe7; }
.cmod.has-sel .c-dev:not(.sel), .cmod.has-sel .c-label { opacity: .4; }
.cmod .c-dev.v2 { display: grid; place-items: center; }
.cmod .c-dev.v2 svg { width: 56%; height: 56%; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.cmod .c-dev.v2.s-ring { background: radial-gradient(circle, var(--g) 0 22%, color-mix(in srgb, var(--g) 10%, #1f2222) 25%); border: 1.5px solid var(--g); }
.cmod .c-dev.v2.s-ring.off { background: #1f2222; border: 1.5px dashed color-mix(in srgb, var(--g) 65%, transparent); }
.cmod .c-dev.v2.s-ring.sel { box-shadow: 0 0 0 2px #1f2222, 0 0 0 3.5px #e5ebe7; }
.cmod .c-dev.v2.s-icon { background: var(--g); border: 2px solid color-mix(in srgb, var(--g) 55%, #0b1d22); color: #0b1d22; }
.cmod .c-dev.v2.s-icon.off { background: #1f2222; border: 1.5px dashed color-mix(in srgb, var(--g) 70%, transparent); color: color-mix(in srgb, var(--g) 75%, transparent); }
.cmod .c-dev.v2.s-square { border-radius: 30%; background: linear-gradient(160deg, color-mix(in srgb, var(--g) 65%, #ffffff) 0%, var(--g) 45%, color-mix(in srgb, var(--g) 55%, #0b1d22) 100%); border: 1px solid color-mix(in srgb, var(--g) 50%, #0b1d22); }
.cmod .c-dev.v2.s-square.off { background: #1f2222; border: 1.5px dashed rgba(229,235,231,.38); }
.c-label { position: absolute; z-index: 13; transform: translateX(-50%); pointer-events: none; font-size: 11px; color: var(--soft); white-space: nowrap; max-width: 110px; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 3px #000, 0 0 6px #000; transition: opacity .2s; }
.c-label.off { color: var(--faint); }
.c-label.sel { color: var(--text); font-weight: 600; }
.cmod .dim { opacity: .14; }
.c-chips { position: absolute; top: 14px; left: 14px; z-index: 30; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100% - 150px); }
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: rgba(0,24,24,.72); font-size: 12px; color: var(--text); }
.chip[aria-pressed="true"] { border-color: var(--g, var(--accent)); background: color-mix(in srgb, var(--g, var(--accent)) 14%, rgba(0,24,24,.8)); }
.chip .c { color: var(--faint); font-variant-numeric: tabular-nums; }
.cmod .c-reset { font-weight: 600; font-size: 12px; padding: 7px 12px; border-radius: 999px; background: rgba(0,24,24,.72); border-color: var(--line); }
.cmod .c-bar .d { display: flex; align-items: center; justify-content: center; gap: 8px; }
.cmod .c-bar .d span { overflow: hidden; text-overflow: ellipsis; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--on); box-shadow: 0 0 8px var(--on); }
.dot.off { background: transparent; border: 1.5px dashed var(--faint); box-shadow: none; }
@keyframes breathe { 50% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--g) 7%, transparent), 0 0 28px color-mix(in srgb, var(--g) 55%, transparent); } }

/* ---------- B: current (Cytoscape look) ---------- */
.b-wrap { position: absolute; inset: 0; padding: 14px; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 12px; background: radial-gradient(ellipse 600px 300px at 15% 0%, rgba(99,229,197,.08), transparent 70%), #212121; font-size: 14px; }
.b-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.b-legend .t { font-size: 12px; color: var(--soft); margin-right: 6px; }
.b-item { display: inline-flex; align-items: center; gap: 8px; min-height: 32px; padding: 4px 10px; border: 1px solid transparent; background: transparent; border-radius: 8px; font-size: 13px; }
.b-item:hover { background: rgba(229,235,231,.06); }
.b-item[aria-pressed="true"] { border-color: var(--accent); background: rgba(99,229,197,.08); }
.b-item .c { color: var(--soft); }
.b-item.on { margin-left: auto; border-color: var(--line); }
.b-body { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 14px; min-height: 0; }
.b-graph { position: relative; min-height: 0; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: radial-gradient(ellipse at 48% 42%, rgba(99,229,197,.12), transparent 65%), radial-gradient(circle, rgba(229,235,231,.045) 1px, transparent 1px) 0 0 / 24px 24px, var(--card); }
.b-graph svg { position: absolute; inset: 0; }
.b-tools { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 6px; }
.b-tools button { width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 8px; background: rgba(0,24,24,.6); font-size: 16px; }
.b-cap { position: absolute; right: 14px; bottom: 20px; font-size: 11px; color: var(--soft); }
.b-insp { min-height: 0; overflow: auto; border: 1px solid var(--line); border-radius: 14px; padding: 16px; background: color-mix(in srgb, #212121 88%, #144659); font-size: 13px; }
.b-insp label { display: grid; gap: 6px; font-size: 12px; color: var(--soft); margin-bottom: 16px; }
.b-insp select { min-height: 40px; border-radius: 8px; background: rgba(0,24,24,.35); color: var(--text); border: 1px solid var(--line); padding: 6px; font: inherit; }
.b-insp .kick { color: var(--accent); font-size: 11px; text-transform: uppercase; margin: 0 0 4px; }
.b-insp h5 { font-size: 19px; margin: 0 0 10px; }
.b-insp .big { font-size: 30px; color: var(--accent); font-weight: 600; margin: 0; }
.b-insp .sec { border-top: 1px solid var(--line); padding: 12px 0; }
.b-insp .sec h6 { font-size: 13px; margin: 0 0 8px; }
.b-insp .row { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
.b-insp .row .c { color: var(--soft); margin-left: auto; }
.b-insp dl { margin: 0; display: grid; gap: 8px; }
.b-insp dt { color: var(--soft); font-size: 12px; }
.b-insp dd { margin: 0; }

/* ---------- D, E: SVG stages ---------- */
.svgstage { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, rgba(20,70,89,.30), transparent 60%), #1f2121; }
.svgstage svg { position: absolute; inset: 0; }
.svgstage text { font-family: var(--f-app); }
.hit { cursor: pointer; }
.hit:focus { outline: none; }
.hit:focus-visible .ring { stroke: var(--accent); stroke-width: 2; }

/* ---------- F: tree ---------- */
.f-scroll { position: absolute; inset: 0; overflow: auto; background: radial-gradient(ellipse 700px 400px at 0% 50%, rgba(20,70,89,.30), transparent 65%), #1f2121; }
.f-canvas { position: relative; }
.f-canvas svg { position: absolute; inset: 0; pointer-events: none; }
.f-router, .f-group, .f-dev { position: absolute; display: flex; align-items: center; }
.f-router { flex-direction: column; justify-content: center; gap: 4px; text-align: center; border: 1px solid rgba(99,229,197,.35); border-radius: 16px; background: rgba(0,24,24,.75); box-shadow: 0 0 40px rgba(99,229,197,.12); padding: 10px; }
.f-router img { width: 64%; filter: drop-shadow(0 0 16px rgba(99,229,197,.45)); }
.f-router b { font-size: 14px; }
.f-router span { font-size: 11px; color: var(--soft); }
.f-group { gap: 8px; padding: 0 12px; height: 40px; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--g) 55%, transparent); background: color-mix(in srgb, var(--g) 13%, rgba(0,24,24,.85)); font-weight: 600; font-size: 13px; }
.f-group .c { margin-left: auto; color: var(--soft); font-weight: 500; font-variant-numeric: tabular-nums; }
.f-dev { gap: 10px; height: 30px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: rgba(0,24,24,.55); font-size: 13px; cursor: pointer; text-align: left; color: var(--text); }
.f-dev:hover { border-color: rgba(229,235,231,.25); }
.f-dev.sel { border-color: var(--accent); background: rgba(99,229,197,.09); }
.f-dev.off { color: var(--faint); }
.f-dev .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.f-dev .cn { font-size: 11px; color: var(--soft); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }
.f-dev .ip { font: 12px ui-monospace, "SF Mono", Menlo, monospace; color: var(--faint); font-variant-numeric: tabular-nums; }

@media (max-width: 980px) {
  .tabs { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .notes { grid-template-columns: 1fr 1fr; }
  .notes .note:first-child { grid-column: 1 / -1; }
}
@media (max-width: 640px) {
  .tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .notes { grid-template-columns: 1fr; }
  .controls .hint { margin-left: 0; width: 100%; }
  .detail { top: auto; bottom: 12px; left: 12px; right: 12px; width: auto; }
  .c-chips { max-width: calc(100% - 28px); top: 54px; }
  .c-bar { font-size: 11px; }
}
@media (prefers-reduced-motion: reduce) { .cmod .c-dev { animation: none; } * { transition: none !important; } }
</style>

<div class="page">
  <header>
    <div class="eyebrow">Nethera · Topologie · Branch topology-visual-refresh</div>
    <h1>Pick a topology style</h1>
    <p>Six ways to draw the same sample network: 5 groups, 15 devices, 4 offline. A is the look from before the redesign and B is the current page. Click devices and drag pills and orbs where the style allows it.</p>
  </header>

  <div class="tabs" role="tablist" aria-label="Topology options" id="tabs"></div>

  <div class="controls">
    <div class="seg" role="group" aria-label="Gruppieren nach">
      <button type="button" data-mode="groups" aria-pressed="true">Gruppen</button>
      <button type="button" data-mode="conn" aria-pressed="false">Verbindungen</button>
    </div>
    <button type="button" class="toggle" id="online" aria-pressed="false"><i></i>Nur online</button>
    <div class="seg" id="dotstyle" role="group" aria-label="Punktstil" hidden>
      <button type="button" data-dot="ring" aria-pressed="true">Ring</button>
      <button type="button" data-dot="icon" aria-pressed="false">Icon</button>
      <button type="button" data-dot="square" aria-pressed="false">Kachel</button>
    </div>
    <span class="hint" id="hint"></span>
  </div>

  <section id="stage" role="tabpanel" aria-live="polite"></section>

  <section class="notes" id="notes"></section>

const state = { dot: 'ring', view: 'A', mode: 'groups', online: false, sel: null, filter: null, zoom: 1, pos: { A: { g: {}, d: {} }, C: { g: {}, d: {} } } };

function ctx() {

function detailCard(stage, c) {

    el.tabIndex = 0; el.setAttribute('role', 'button'); el.setAttribute('aria-label', `Gruppe ${hub.name}`);
    const k = hub.devices.length;
    const dR = modern ? Math.min(small ? 112 : 168, Math.max(small ? 60 : 82, 48 + k * (small ? 10 : 14)))

        v2 && state.dot === 'icon' ? `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[TYPES[d.id]] || ICONS.unknown}</svg>` : null);
      de.style.setProperty('--g', groupOf(d).color); de.style.width = de.style.height = dS + 'px';
      de.tabIndex = 0; de.setAttribute('role', 'button'); de.setAttribute('aria-label', `${d.name}, Gruppe ${hub.name}`);

/* ===== B: current ===== */
function current(st, w, h, c) {

  S('image', { href: ROUTER, x: rp.x - rr * .8, y: rp.y - rr * .8, width: rr * 1.6, height: rr * 1.6 }, svg);

/* ===== D: orbit ===== */
function orbit(st, w, h, c) {
  const wrap = H('div', 'svgstage', st);
  const svg = S('svg', { width: w, height: h }, wrap);
  const small = w < 640;
  const cx = w / 2, cy = h / 2;
  const Rmax = Math.max(130, Math.min(w / 2 - (small ? 70 : 130), h / 2 - 46));
  const R = Rmax, band = small ? 20 : 26;
  defs(svg);
  [R - band, R + band].forEach(r => S('circle', { cx, cy, r, fill: 'none', stroke: '#e5ebe7', 'stroke-opacity': .05, 'stroke-dasharray': '2 6' }, svg));
  S('circle', { cx, cy, r: R * .5, fill: 'none', stroke: '#63e5c5', 'stroke-opacity': .07 }, svg);
  const total = c.hubs.reduce((s, hb) => s + hb.devices.length + .8, 0) || 1, gap = .05;
  let a = -Math.PI / 2 - (c.hubs[0] ? Math.PI * 2 * (c.hubs[0].devices.length + .8) / total / 2 : 0);
  const pt = (r, t) => [cx + r * Math.cos(t), cy + r * Math.sin(t)];
  const rIn = Math.min(R * .2, 70) + 6;
  const layerL = S('g', {}, svg), layerS = S('g', {}, svg), layerP = S('g', {}, svg), layerD = S('g', {}, svg);
  c.hubs.forEach(hub => {
    const span = Math.PI * 2 * (hub.devices.length + .8) / total, a0 = a + gap / 2, a1 = a + span - gap / 2, mid = (a0 + a1) / 2;
    const ri = R - band, ro = R + band, large = a1 - a0 > Math.PI ? 1 : 0;
    const [x0, y0] = pt(ro, a0), [x1, y1] = pt(ro, a1), [x2, y2] = pt(ri, a1), [x3, y3] = pt(ri, a0);
    S('path', { d: `M${x0},${y0} A${ro},${ro} 0 ${large} 1 ${x1},${y1} L${x2},${y2} A${ri},${ri} 0 ${large} 0 ${x3},${y3} Z`, fill: hub.color, 'fill-opacity': .09, stroke: hub.color, 'stroke-opacity': .32 }, layerS);
    const [px, py] = pt(R * .5, mid), [sx, sy] = pt(rIn, mid), [ex, ey] = pt(ri, mid);
    S('line', { x1: sx, y1: sy, x2: ex, y2: ey, stroke: hub.color, 'stroke-opacity': .4, 'stroke-width': 1.3 }, layerL);
    const pg = S('g', {}, layerP);
    const t = S('text', { x: px, y: py + 4, 'text-anchor': 'middle', fill: '#e5ebe7', 'font-size': 12, 'font-weight': 600 }, pg);
    t.textContent = `${hub.name} · ${hub.devices.length}`;
    const bb = t.getBBox();
    pg.insertBefore(S('rect', { x: bb.x - 10, y: bb.y - 5, width: bb.width + 20, height: bb.height + 10, rx: (bb.height + 10) / 2, fill: '#0c2026', stroke: hub.color, 'stroke-opacity': .7 }), t);
    const k = hub.devices.length;
    hub.devices.forEach((d, i) => {
      const th = a0 + (a1 - a0) * (i + .5) / k, [x, y] = pt(R, th), sel = state.sel === d.id;
      const g = S('g', { class: 'hit', tabindex: 0, role: 'button', 'aria-label': d.name }, layerD);
      if (d.online) S('circle', { cx: x, cy: y, r: sel ? 20 : 14, fill: hub.color, 'fill-opacity': sel ? .3 : .16, filter: 'url(#glow)' }, g);
      S('circle', { class: 'ring', cx: x, cy: y, r: sel ? 11 : 8, fill: d.online ? groupOf(d).color : '#1f2121', stroke: d.online ? '#e5ebe7' : '#9aa8b0', 'stroke-opacity': d.online ? .5 : .6, 'stroke-width': sel ? 2 : 1.2, 'stroke-dasharray': d.online ? '' : '3 2' }, g);
      const cos = Math.cos(th), lr = R + band + 8, [lx, ly] = pt(lr, th);
      const txt = S('text', { x: lx, y: ly + 4 + Math.sin(th) * 6, 'text-anchor': cos > .25 ? 'start' : cos < -.25 ? 'end' : 'middle', fill: d.online ? (sel ? '#63e5c5' : '#e5ebe7') : '#8b979d', 'font-size': small ? 11 : 12, 'font-weight': sel ? 600 : 400 }, g);
      txt.textContent = small ? short(d.name, 12) : d.name;
      S('circle', { cx: x, cy: y, r: 18, fill: 'transparent' }, g);
      g.onclick = () => select(d.id); g.onkeydown = e => { if (e.key === 'Enter') select(d.id); };
    });
    a += span;
  });
  const rs = Math.min(R * .4, 140);
  S('circle', { cx, cy, r: rs * .62, fill: 'url(#core)' }, svg);
  S('image', { href: ROUTER, x: cx - rs / 2, y: cy - rs / 2, width: rs, height: rs, filter: 'url(#glow)' }, svg);
  const rt = S('text', { x: cx, y: cy + rs / 2 + 4, 'text-anchor': 'middle', fill: '#63e5c5', 'font-size': 12, 'font-weight': 600 }, svg); rt.textContent = ROUTER_NAME;

}
function defs(svg) {
  const d = S('defs', {}, svg);
  const f = S('filter', { id: 'glow', x: '-60%', y: '-60%', width: '220%', height: '220%' }, d);
  S('feGaussianBlur', { stdDeviation: 5 }, f);

}

/* ===== E: clusters ===== */
function clusters(st, w, h, c) {
  const wrap = H('div', 'svgstage', st);
  const svg = S('svg', { width: w, height: h }, wrap);
  defs(svg);
  const cw = 96, ch = 54;
  const bubbles = c.hubs.map(hub => {
    const n = hub.devices.length, cols = n <= 2 ? n : n <= 4 ? 2 : 3, rows = Math.ceil(n / cols);
    return { hub, cols, rows, r: Math.hypot(cols * cw / 2, rows * ch / 2) + 16 };
  });
  const circ = bubbles.reduce((s, b) => s + 2 * b.r + 34, 0);
  const maxR = Math.max(...bubbles.map(b => b.r), 0);
  const ring = Math.max(circ / (2 * Math.PI), maxR + 120);
  let a = -Math.PI / 2 - (bubbles[0] ? (2 * bubbles[0].r + 34) / circ * Math.PI : 0);
  bubbles.forEach(b => { const span = (2 * b.r + 34) / circ * Math.PI * 2; const t = a + span / 2; b.x = Math.cos(t) * ring; b.y = Math.sin(t) * ring; a += span; });
  const minX = Math.min(...bubbles.map(b => b.x - b.r), -80), maxX = Math.max(...bubbles.map(b => b.x + b.r), 80);
  const minY = Math.min(...bubbles.map(b => b.y - b.r - 26), -80), maxY = Math.max(...bubbles.map(b => b.y + b.r), 80);
  const s = Math.min((w - 40) / (maxX - minX), (h - 40) / (maxY - minY), 1);
  const root = S('g', { transform: `translate(${w / 2 - (minX + maxX) / 2 * s},${h / 2 - (minY + maxY) / 2 * s}) scale(${s})` }, svg);
  bubbles.forEach(b => {
    const d = Math.hypot(b.x, b.y), ux = b.x / d, uy = b.y / d;
    S('line', { x1: ux * 62, y1: uy * 62, x2: b.x - ux * b.r, y2: b.y - uy * b.r, stroke: b.hub.color, 'stroke-opacity': .45, 'stroke-width': 1.4, 'stroke-dasharray': '3 5' }, root);
  });
  S('circle', { cx: 0, cy: 0, r: 80, fill: 'url(#core)' }, root);
  S('image', { href: ROUTER, x: -56, y: -56, width: 112, height: 112, filter: 'url(#glow)' }, root);
  const rt = S('text', { x: 0, y: 70, 'text-anchor': 'middle', fill: '#63e5c5', 'font-size': 12, 'font-weight': 600 }, root); rt.textContent = ROUTER_NAME;
  bubbles.forEach(b => {
    S('circle', { cx: b.x, cy: b.y, r: b.r, fill: b.hub.color, 'fill-opacity': .07, stroke: b.hub.color, 'stroke-opacity': .45, 'stroke-width': 1.3 }, root);
    const t = S('text', { x: b.x, y: b.y - b.r - 10, 'text-anchor': 'middle', fill: b.hub.color, 'font-size': 13, 'font-weight': 700 }, root);
    t.textContent = b.hub.name; const cnt = S('tspan', { fill: '#9aa8b0', 'font-weight': 400 }, t); cnt.textContent = `  ${b.hub.devices.length}`;
    b.hub.devices.forEach((d, i) => {
      const col = i % b.cols, row = Math.floor(i / b.cols);
      const inRow = Math.min(b.cols, b.hub.devices.length - row * b.cols);
      const x = b.x + (col - (inRow - 1) / 2) * cw, y = b.y + (row - (b.rows - 1) / 2) * ch - 6, sel = state.sel === d.id;
      const g = S('g', { class: 'hit', tabindex: 0, role: 'button', 'aria-label': d.name }, root);
      S('rect', { x: x - cw / 2 + 4, y: y - 16, width: cw - 8, height: ch - 6, rx: 10, fill: sel ? '#63e5c5' : 'transparent', 'fill-opacity': sel ? .12 : 0, stroke: sel ? '#63e5c5' : 'none', 'stroke-opacity': .7 }, g);
      S('circle', { class: 'ring', cx: x, cy: y - 2, r: 8, fill: d.online ? groupOf(d).color : '#1f2121', stroke: d.online ? '#e5ebe7' : '#9aa8b0', 'stroke-opacity': .55, 'stroke-dasharray': d.online ? '' : '3 2', filter: d.online ? 'url(#glow)' : '' }, g);
      const lt = S('text', { x, y: y + 20, 'text-anchor': 'middle', fill: d.online ? '#e5ebe7' : '#8b979d', 'font-size': 11 }, g); lt.textContent = short(d.name, 14);
      g.onclick = () => select(d.id); g.onkeydown = e => { if (e.key === 'Enter') select(d.id); };

}

/* ===== F: tree ===== */
function tree(st, w, h, c) {
  const sc = H('div', 'f-scroll', st);
  const small = w < 640;
  const rx = 16, rw = small ? 96 : 170, gx = small ? 128 : 250, gw = small ? 120 : 180, dx = small ? 268 : 500;
  const width = Math.max(w, dx + (small ? 200 : 300));
  const dw = Math.min(width - dx - 16, 440);
  const rowH = 36, gapG = 22, top = 24;
  let y = top; const rows = [];
  c.hubs.forEach(hub => { const y0 = y; hub.devices.forEach(d => { rows.push({ d, hub, y }); y += rowH; }); hub.y = (y0 + y - rowH) / 2 + 15; y += gapG; });
  const height = Math.max(h, y + 10);
  const cv = H('div', 'f-canvas', sc); cv.style.width = width + 'px'; cv.style.height = height + 'px';
  const svg = S('svg', { width, height }, cv);
  const ry = (top + y - gapG - rowH) / 2 + 15, rh = small ? 110 : 140;
  const curve = (x1, y1, x2, y2, col, op, wd) => S('path', { d: `M${x1},${y1} C${(x1 + x2) / 2},${y1} ${(x1 + x2) / 2},${y2} ${x2},${y2}`, fill: 'none', stroke: col, 'stroke-opacity': op, 'stroke-width': wd }, svg);
  c.hubs.forEach(hub => {
    curve(rx + rw, ry, gx, hub.y, '#63e5c5', .35, 1.4);
    hub.devices.forEach(d => { const r = rows.find(q => q.d === d); const sel = state.sel === d.id; curve(gx + gw, hub.y, dx, r.y + 15, hub.color, sel ? .9 : .35, sel ? 2 : 1.2); });
  });
  const router = H('div', 'f-router', cv, `<img src="${ROUTER}" alt=""><b>${ROUTER_NAME}</b><span>${c.devs.length} Geräte · ${c.devs.filter(d => d.online).length} online</span>`);
  Object.assign(router.style, { left: rx + 'px', top: (ry - rh / 2) + 'px', width: rw + 'px', height: rh + 'px' });
  c.hubs.forEach(hub => {
    const g = H('div', 'f-group', cv, `<span class="sw" style="--g:${hub.color};margin:0"></span>${esc(hub.name)}<span class="c">${hub.devices.length}</span>`);
    g.style.setProperty('--g', hub.color); Object.assign(g.style, { left: gx + 'px', top: (hub.y - 20) + 'px', width: gw + 'px' });
  });
  rows.forEach(({ d, y }) => {
    const b = H('button', 'f-dev' + (d.online ? '' : ' off') + (state.sel === d.id ? ' sel' : ''), cv,
      `<i class="dot${d.online ? '' : ' off'}"></i><span class="nm">${esc(d.name)}</span><span class="cn">${d.conn}</span>${dw >= 300 ? `<span class="ip">${d.ip}</span>` : ''}`);
    b.type = 'button'; Object.assign(b.style, { left: dx + 'px', top: y + 'px', width: dw + 'px' });
    b.onclick = () => select(d.id);
  });
  detailCard(st, c);
}

    <div class="note"><h3>Watch out</h3><ul class="minus">${o.minus.map(x => `<li>${x}</li>`).join('')}</ul></div>`;

$('#online').onclick = () => { state.online = !state.online; $('#online').setAttribute('aria-pressed', String(state.online)); render(); };
let raf = 0, lastW = 0, lastH = 0;
new ResizeObserver(() => {

</script>
