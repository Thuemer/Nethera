# Nethera MQTT broker: routers push telemetry, the backend subscribes
# 1883: plain MQTT for the backend and for routers on the LAN
listener 1883
# 9001: MQTT over WebSockets, for routers that connect through an HTTPS ingress (wss://<host>/mqtt)
listener 9001
protocol websockets

# The settings below apply to both listeners
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/data/acl

persistence true
persistence_location /mosquitto/data/
log_dest stdout
