server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = / {
        try_files /website/html/nethera.html =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location ~* \.(html|css|js)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        try_files $uri =404;
    }
}
