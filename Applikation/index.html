<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nethera</title>
  <script>
    const loginCallback = /(?:^|[?#&])(code|error)=/.test(location.href);
    const cameFromWebsite = new URLSearchParams(location.search).get('entry') === 'website';
    let visitedWebsite = false;
    try {
      if (cameFromWebsite) sessionStorage.setItem('nethera-website-visited', '1');
      visitedWebsite = sessionStorage.getItem('nethera-website-visited') === '1';
    } catch (_) { /* session storage can be disabled */ }
    if (location.pathname !== '/' && !cameFromWebsite && !loginCallback && !visitedWebsite) {
      location.replace('/');
    }
  </script>
  <link rel="icon" href="nethera_logo.png">
  <link rel="stylesheet" href="nethera-select.css">
  <style>
    html, body { height: 100%; }
    body { margin: 0; background: var(--bg-main); font-family: "Avenir Next", "Segoe UI", sans-serif; overflow: hidden; }
    #home { display: flex; height: 100%; }
    #home[hidden], #auth-loading[hidden] { display: none; }
    #auth-loading { min-height: 100%; display: grid; place-content: center; gap: 16px; padding: 24px; box-sizing: border-box; color: var(--text-main); text-align: center; }
    #auth-loading p { margin: 0; color: var(--text-soft); }
    #auth-loading a { color: var(--accent); }
    #nav-bar { width: 248px; flex-shrink: 0; display: flex; flex-direction: column; background: var(--accent-2); color: var(--text-main); padding: 16px 12px 12px; box-sizing: border-box; position: relative; transition: width .25s ease; z-index: 2; }
    #nav-bar.collapsed { width: 72px; }
    .nav-header { display: flex; align-items: center; justify-content: space-between; gap: 6px; min-height: 48px; padding: 0 4px 0 8px; margin-bottom: 24px; }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; color: var(--text-main); text-decoration: none; }
    .brand img { width: 34px; height: 34px; flex: none; object-fit: contain; }
    .brand .name { font-size: 21px; font-weight: 700; white-space: nowrap; }
    #nav-bar.collapsed .nav-header { flex-direction: column; padding: 0; gap: 10px; margin-bottom: 20px; }
    #nav-bar.collapsed .name, #nav-bar.collapsed .label, #nav-bar.collapsed .section-title { display: none; }
    #nav-toggle { flex: none; display: inline-grid; place-items: center; width: 36px; height: 36px; background: transparent; border: 1px solid rgba(var(--text-rgb), .16); color: var(--text-soft); cursor: pointer; padding: 0; border-radius: 7px; }
    #nav-toggle:hover { color: var(--text-main); background: rgba(var(--text-rgb), .08); }
    #nav-toggle svg, .icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    #nav-toggle .expand-icon, #nav-toggle .menu-icon, #nav-toggle .close-icon, #nav-bar.collapsed #nav-toggle .collapse-icon { display: none; }
    #nav-bar.collapsed #nav-toggle .expand-icon { display: block; }
    .nav-groups { display: flex; flex-direction: column; flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin; }
    .nav-group { padding-bottom: 12px; margin-bottom: 12px; border-bottom: 1px solid rgba(var(--text-rgb), .12); }
    .nav-group:last-child { border-bottom: 0; margin-bottom: 0; }
    .nav-account { margin-top: auto; padding-top: 12px; border-top: 1px solid rgba(var(--text-rgb), .12); }
    #nav-bar.collapsed .nav-group { padding-bottom: 10px; margin-bottom: 10px; }
    .section-title { margin: 0 0 6px; padding: 0 12px; font-size: 11px; font-weight: 650; text-transform: uppercase; color: var(--text-soft); }
    .nav-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 2px; }
    .nav-item { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; box-sizing: border-box; color: var(--text-soft); text-decoration: none; border-radius: 7px; cursor: pointer; transition: background .16s ease, color .16s ease; }
    .nav-item:hover { color: var(--text-main); background: rgba(var(--text-rgb), .06); }
    .nav-item.active { color: var(--accent); background: rgba(var(--accent-rgb), .12); }
    #nav-bar.collapsed .nav-item { justify-content: center; padding: 0; }
    .icon { width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 22px; }
    .label { white-space: nowrap; font-weight: 500; font-size: 14px; }
    #screen { flex: 1; min-width: 0; min-height: 100%; position: relative; overflow: hidden; }
    iframe { width: 100%; height: 100%; border: 0; display: block; }
    #account-root { width: 100%; height: 100%; display: none; }
    #screen.account-active iframe { display: none; }
    #screen.account-active #account-root { display: block; }
    @media (max-width: 900px) {
      #home { flex-direction: column; height: 100dvh; }
      #nav-bar, #nav-bar.collapsed { width: 100%; height: 64px; flex: none; padding: 8px 16px; display: block; }
      .nav-header, #nav-bar.collapsed .nav-header { display: flex; flex-direction: row; justify-content: space-between; min-height: 48px; padding: 0; margin: 0; }
      #nav-bar.collapsed .brand .name { display: inline; }
      #nav-bar.collapsed .section-title { display: block; }
      #nav-toggle, #nav-bar.collapsed #nav-toggle { width: 44px; height: 44px; }
      #nav-toggle .collapse-icon, #nav-toggle .expand-icon { display: none !important; }
      #nav-toggle .menu-icon { display: block; }
      #nav-bar.mobile-open #nav-toggle .menu-icon { display: none; }
      #nav-bar.mobile-open #nav-toggle .close-icon { display: block; }
      .nav-groups { display: none; position: absolute; left: 0; right: 0; top: 64px; max-height: calc(100dvh - 64px); overflow-y: auto; padding: 16px; background: var(--accent-2); box-shadow: 0 16px 28px rgba(0,0,0,.4); border-radius: 0 0 8px 8px; }
      #nav-bar.mobile-open .nav-groups { display: block; }
      .nav-group { margin-bottom: 16px; }
      .nav-account { margin-top: 0; }
      .nav-list { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; }
      #nav-bar.collapsed .nav-item { justify-content: flex-start; padding: 0 12px; }
      .nav-item .label, #nav-bar.collapsed .nav-item .label { display: inline; font-size: 13px; overflow: hidden; text-overflow: ellipsis; }
      #screen { min-height: 0; flex: 1; }
    }
    @media (max-width: 380px) { .nav-list { grid-template-columns: 1fr; } }
  </style>
  <link id="nethera-theme" rel="stylesheet" href="nethera-theme.css?v=20261012-polish">
</head>

  <script src="config.js"></script>
  <script src="nethera-select.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/keycloak-js@24.0.5/dist/keycloak.min.js"></script>
  <script src="account.js?v=20261011-brand"></script>
  <script>
    const APP_VERSION = '20261012-sidebar2';
    const nav = document.getElementById('nav-bar');
    const items = document.querySelectorAll('.nav-item');
    const screen = document.getElementById('screen');
    const frame = document.getElementById('screen-frame');
    const accountRoot = document.getElementById('account-root');
    const toggle = document.getElementById('nav-toggle');
    const brand = document.querySelector('.brand');

    if (localStorage.getItem('nav-collapsed') === '1') nav.classList.add('collapsed');

    function updateToggleLabel() {
      const mobile = window.matchMedia('(max-width: 900px)').matches;
      const label = mobile ? (nav.classList.contains('mobile-open') ? 'Menü schließen' : 'Menü öffnen')
        : (nav.classList.contains('collapsed') ? 'Seitenleiste ausklappen' : 'Seitenleiste einklappen');
      toggle.setAttribute('aria-label', label);
      toggle.title = label;
      toggle.setAttribute('aria-expanded', String(mobile ? nav.classList.contains('mobile-open') : !nav.classList.contains('collapsed')));
    }
    updateToggleLabel();
    window.addEventListener('resize', updateToggleLabel);
    nav.addEventListener('transitionend', event => {
      if (event.propertyName === 'width') frame.contentWindow?.dispatchEvent(new Event('resize'));
    });

    function setActive(item) {
      items.forEach(i => i.classList.remove('active'));
      item?.classList.add('active');
    }

    function versionedSrc(src) {
      if (!src || src === 'account.html') return src;
      const separator = src.includes('?') ? '&' : '?';
      return `${src}${separator}v=${APP_VERSION}`;
    }

    function baseSrc(src) {
      return String(src || '').split('?')[0];
    }

    async function openScreen(src, item, updateUrl = true) {
      if (!src) return;
      setActive(item);

      nav.classList.remove('mobile-open');
      updateToggleLabel();
      if (src === 'account.html') {
        screen.classList.add('account-active');
        await window.NetheraAccount?.render(accountRoot);
        window.NetheraSelect?.enhanceAll(accountRoot);
        if (updateUrl) history.replaceState(null, '', 'index.html?screen=account');
        return;
      }

      screen.classList.remove('account-active');
      accountRoot.innerHTML = '';
      if (baseSrc(frame.getAttribute('src')) !== src) frame.src = versionedSrc(src);
      if (updateUrl) history.replaceState(null, '', 'index.html');
    }

    items.forEach(item => {
      item.addEventListener('click', event => {
        event.preventDefault();
        openScreen(item.dataset.src, item);
      });
    });
    brand.addEventListener('click', event => {
      event.preventDefault();
      openScreen('overview.html', [...items].find(item => item.dataset.src === 'overview.html'));
    });

    toggle.addEventListener('click', () => {
      if (window.matchMedia('(max-width: 900px)').matches) {
        nav.classList.toggle('mobile-open');
        updateToggleLabel();
        return;
      }
      const collapsed = nav.classList.toggle('collapsed');
      localStorage.setItem('nav-collapsed', collapsed ? '1' : '0');
      updateToggleLabel();
    });

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        nav.classList.remove('mobile-open');
        updateToggleLabel();
      }
    });

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const auth = await window.NetheraAccount?.init();
        if (!auth?.authenticated) throw new Error('Keycloak hat die Anmeldung nicht bestätigt.');
      } catch (error) {
        console.warn('Keycloak Initialisierung nicht verfügbar:', error);
        document.getElementById('auth-loading').innerHTML = 'Anmeldung derzeit nicht verfügbar. <a href="/index.html">Erneut versuchen</a>';
        return;
      }

      document.getElementById('auth-loading').hidden = true;
      document.getElementById('home').hidden = false;
      const params = new URLSearchParams(window.location.search);
      const requested = params.get('screen') === 'account' ? 'account.html' : 'overview.html';
      const item = [...items].find(i => i.dataset.src === requested) || items[0];
      await openScreen(requested, item, false);
    });
  </script>
</body>
