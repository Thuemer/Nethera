<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nethera</title>
  <script>
    const loginCallback = /(?:^|[?#&])(code|error)=/.test(location.href);
    const cameFromWebsite = new URLSearchParams(location.search).get('entry') === 'website';
    let visitedWebsite = false;
    try {
      if (cameFromWebsite) sessionStorage.setItem('nethera-website-visited', '1');
      visitedWebsite = sessionStorage.getItem('nethera-website-visited') === '1';
    } catch (_) { /* session storage can be disabled */ }
    if (location.pathname !== '/' && !cameFromWebsite && !loginCallback && !visitedWebsite) {
      location.replace('/');
    }
  </script>
  <link rel="icon" href="nethera_logo.png">
  <link rel="stylesheet" href="nethera-select.css">
  <style>
    html, body { height: 100%; }
    body { margin: 0; background: #121212; font-family: "Avenir Next", "Segoe UI", sans-serif; overflow: hidden; }
    #home { display: flex; height: 100%; }
    #home[hidden], #auth-loading[hidden] { display: none; }
    #auth-loading { min-height: 100%; display: grid; place-content: center; gap: 16px; padding: 24px; box-sizing: border-box; color: #fff; text-align: center; }
    #auth-loading p { margin: 0; color: #b8c0bd; }
    #auth-loading a { color: #63e5c5; }
    #nav-bar { width: 240px; background: #144659; color: #fff; padding: 16px; box-sizing: border-box; position: relative; transition: width .25s ease; box-shadow: 6px 0 24px rgba(0,0,0,.45); z-index: 2; }
    #nav-bar.collapsed { width: 68px; }
    .brand { display: flex; align-items: center; gap: 10px; margin: -16px -16px 12px; background: #2FB09A; padding: 12px 16px; border-radius: 0 0 6px 6px; color: #fff; text-decoration: none; }
    .brand img { width: 36px; height: 36px; border-radius: 6px; }
    .brand .name { font-size: 22px; font-weight: 800; }
    #nav-bar.collapsed .name, #nav-bar.collapsed .label, #nav-bar.collapsed .title-text { display: none; }
    #nav-toggle { position: absolute; top: 12px; right: -20px; background: rgba(255,255,255,.08); border: 0; color: #fff; cursor: pointer; padding: 8px 10px; border-radius: 10px; box-shadow: 0 6px 14px rgba(0,0,0,.35); }
    #nav-bar.collapsed #nav-toggle { transform: rotate(180deg); }
    .section-title { margin: 12px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #a9b4b7; }
    .nav-groups { display: contents; }
    .nav-list { list-style: none; padding: 0; margin: 6px 0 12px; }
    .nav-list li { margin: 8px 0; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; color: #e6e6e6; text-decoration: none; border-radius: 8px; cursor: pointer; transition: background .16s ease, transform .16s ease; }
    .nav-item:hover { background: rgba(255,255,255,.06); transform: translateX(5px); }
    .nav-item.active { background: rgba(255,255,255,.11); box-shadow: inset 4px 0 0 #2FB09A; }
    .icon { width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 22px; }
    .label { white-space: nowrap; font-weight: 650; font-size: 14px; }
    .spacer { height: 10px; }
    #screen { flex: 1; min-width: 0; min-height: 100%; position: relative; overflow: hidden; }
    iframe { width: 100%; height: 100%; border: 0; display: block; }
    #account-root { width: 100%; height: 100%; display: none; }
    #screen.account-active iframe { display: none; }
    #screen.account-active #account-root { display: block; }
    @media (max-width: 900px) {
      #home { flex-direction: column; height: 100dvh; }
      #nav-bar, #nav-bar.collapsed { width: 100%; height: 64px; flex: none; padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 18px rgba(0,0,0,.28); }
      .brand { margin: 0; border-radius: 6px; padding: 5px 8px; }
      #nav-bar.collapsed .brand .name { display: inline; }
      #nav-toggle, #nav-bar.collapsed #nav-toggle { position: static; display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; padding: 0; transform: none; font-size: 0; }
      #nav-toggle { order: 1; }
      .brand { order: 0; }
      #nav-toggle::before { content: '☰'; font-size: 24px; line-height: 1; }
      #nav-bar.mobile-open #nav-toggle::before { content: '×'; font-size: 30px; }
      .section-title, .spacer { display: none; }
      .nav-groups { display: none; position: absolute; left: 0; right: 0; top: 64px; max-height: calc(100dvh - 64px); overflow-y: auto; padding: 8px 12px 12px; background: #144659; box-shadow: 0 16px 28px rgba(0,0,0,.4); border-radius: 0 0 8px 8px; }
      #nav-bar.mobile-open .nav-groups { display: block; }
      .nav-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; margin: 0; }
      .nav-list:last-child { margin-top: 4px; }
      .nav-list li { margin: 0; min-width: 0; }
      .nav-item { padding: 10px; min-height: 44px; }
      .nav-item .label, #nav-bar.collapsed .nav-item .label { display: inline; font-size: 13px; overflow: hidden; text-overflow: ellipsis; }
      #screen { min-height: 0; flex: 1; }
    }
    @media (max-width: 380px) { .nav-list { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div id="auth-loading" role="status" aria-live="polite">Anmeldung wird geprüft...</div>
  <div id="home" hidden>
    <nav id="nav-bar" aria-label="Navigation">
      <button id="nav-toggle" aria-label="Navigation ein-/ausklappen" aria-controls="nav-groups" aria-expanded="false">◀</button>
      <a class="brand" href="/" title="Zur Nethera-Website"><img src="nethera_logo.png" alt="Nethera Logo"><div class="name">Nethera</div></a>

      <div class="nav-groups" id="nav-groups">
      <h3 class="section-title"><span class="title-text">Hauptmenü</span></h3>
      <ul class="nav-list">
        <li><a class="nav-item" data-src="overview.html"><span class="icon">▦</span><span class="label">Dashboard</span></a></li>
        <li><a class="nav-item" data-src="devices.html"><span class="icon">▣</span><span class="label">Clients</span></a></li>
        <li><a class="nav-item" data-src="time-limits.html"><span class="icon">◷</span><span class="label">Zeitlimits</span></a></li>
        <li><a class="nav-item" data-src="security.html"><span class="icon">◇</span><span class="label">Schutz</span></a></li>
        <li><a class="nav-item" data-src="network-status.html"><span class="icon">◉</span><span class="label">Status</span></a></li>
        <li><a class="nav-item" data-src="topologie_custom.html"><span class="icon">⌘</span><span class="label">Topologie</span></a></li>
      </ul>

      <div class="spacer"></div>
      <ul class="nav-list">
        <li><a class="nav-item" data-src="traffic.html"><span class="icon">▥</span><span class="label">Datenverkehr</span></a></li>
        <li><a class="nav-item" data-src="configuration.html"><span class="icon">⚙</span><span class="label">Konfiguration</span></a></li>
        <li><a class="nav-item" data-src="account.html"><span class="icon">●</span><span class="label">Mein Account</span></a></li>
      </ul>
      </div>
    </nav>

    <main id="screen">
      <iframe id="screen-frame" title="Nethera Dashboard"></iframe>
      <div id="account-root" aria-live="polite"></div>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="nethera-select.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/keycloak-js@24.0.5/dist/keycloak.min.js"></script>
  <script src="account.js?v=20261009-entry"></script>
  <script>
    const APP_VERSION = '20261009-responsive';
    const nav = document.getElementById('nav-bar');
    const items = document.querySelectorAll('.nav-item');
    const screen = document.getElementById('screen');
    const frame = document.getElementById('screen-frame');
    const accountRoot = document.getElementById('account-root');
    const toggle = document.getElementById('nav-toggle');

    if (localStorage.getItem('nav-collapsed') === '1') nav.classList.add('collapsed');

    function setActive(item) {
      items.forEach(i => i.classList.remove('active'));
      item?.classList.add('active');
    }

    function versionedSrc(src) {
      if (!src || src === 'account.html') return src;
      const separator = src.includes('?') ? '&' : '?';
      return `${src}${separator}v=${APP_VERSION}`;
    }

    function baseSrc(src) {
      return String(src || '').split('?')[0];
    }

    async function openScreen(src, item, updateUrl = true) {
      if (!src) return;
      setActive(item);

      nav.classList.remove('mobile-open');
      toggle.setAttribute('aria-expanded', 'false');
      if (src === 'account.html') {
        screen.classList.add('account-active');
        await window.NetheraAccount?.render(accountRoot);
        window.NetheraSelect?.enhanceAll(accountRoot);
        if (updateUrl) history.replaceState(null, '', 'index.html?screen=account');
        return;
      }

      screen.classList.remove('account-active');
      accountRoot.innerHTML = '';
      if (baseSrc(frame.getAttribute('src')) !== src) frame.src = versionedSrc(src);
      if (updateUrl) history.replaceState(null, '', 'index.html');
    }

    items.forEach(item => {
      item.addEventListener('click', () => openScreen(item.dataset.src, item));
    });

    toggle.addEventListener('click', () => {
      if (window.matchMedia('(max-width: 900px)').matches) {
        const open = nav.classList.toggle('mobile-open');
        toggle.setAttribute('aria-expanded', String(open));
        return;
      }
      const collapsed = nav.classList.toggle('collapsed');
      localStorage.setItem('nav-collapsed', collapsed ? '1' : '0');
    });

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        nav.classList.remove('mobile-open');
        toggle.setAttribute('aria-expanded', 'false');
      }
    });

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const auth = await window.NetheraAccount?.init();
        if (!auth?.authenticated) throw new Error('Keycloak hat die Anmeldung nicht bestätigt.');
      } catch (error) {
        console.warn('Keycloak Initialisierung nicht verfügbar:', error);
        document.getElementById('auth-loading').innerHTML = 'Anmeldung derzeit nicht verfügbar. <a href="/index.html">Erneut versuchen</a>';
        return;
      }

      document.getElementById('auth-loading').hidden = true;
      document.getElementById('home').hidden = false;
      const params = new URLSearchParams(window.location.search);
      const requested = params.get('screen') === 'account' ? 'account.html' : 'overview.html';
      const item = [...items].find(i => i.dataset.src === requested) || items[0];
      await openScreen(requested, item, false);
    });
  </script>
</body>
</html>
