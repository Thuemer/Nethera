<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Konfiguration</title>
  <link rel="icon" href="nethera_logo.png">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="nethera-select.css">
  <link rel="stylesheet" href="nethera-theme.css?v=20261012-polish">
  <link rel="stylesheet" href="data-source.css">
</head>
<body>
  <main class="page">
    <app-hero title="Konfiguration" text="Router, Netzwerk und Verhalten verständlich einstellen." button="Speichern"></app-hero>

    <section class="settings-summary card">
      <article><strong>Router</strong><span>Name und Betriebsmodus.</span></article>
      <article><strong>Schutz</strong><span>Updates, DNS-Blocking und Gastnetz.</span></article>
      <article><strong>Speicherung</strong><span>Deine Änderungen bleiben erhalten.</span></article>
    </section>

    <fieldset id="configFields" class="grid two-grid" disabled style="border:0;padding:0;margin:0;min-width:0">
      <app-card title="Router" >
        <p class="muted">Name und Betriebsmodus deines Routers.</p>
        <label class="field"><span>Routername</span><input id="routerName" type="text" placeholder="Noch nicht geladen"></label>
        <label class="field"><span>Betriebsmodus</span><select id="securityMode"><option value="GATEWAY">Gateway - normaler Router</option><option value="REPEATER">Repeater - WLAN erweitern</option><option value="BRIDGE">Bridge - nur Netzwerkbrücke</option></select></label>
        <label class="config-row"><span><strong>Automatische Updates</strong><small>Firmware-Updates im Hintergrund erlauben</small></span><input id="updates" type="checkbox"></label>
        <label class="config-row"><span><strong>DNS Blocking</strong><small>Tracker und bekannte Werbedomains blockieren</small></span><input id="dnsBlocking" type="checkbox"></label>
      </app-card>

      <app-card title="Netzwerk" >
        <p class="muted">Für einen einfachen Heimrouter sind LAN-IP und Gateway meistens gleich.</p>
        <label class="field"><span>LAN-IP</span><input id="lanIp" type="text" placeholder="Noch nicht geladen"></label>
        <label class="field"><span>Gateway</span><input id="gatewayIp" type="text" placeholder="Noch nicht geladen"></label>
        <label class="config-row"><span><strong>Gastnetzwerk</strong><small>Separates WLAN für Gäste aktivieren</small></span><input id="guestNetwork" type="checkbox"></label>
        <label class="config-row"><span><strong>Profi-Metriken</strong><small>Zusätzliche technische Werte anzeigen</small></span><input id="profiling" type="checkbox" checked></label>
      </app-card>
    </fieldset>

    <section class="card" aria-label="Änderungen">
      <p id="changeState" role="status">Noch keine Konfiguration geladen</p>
      <button id="discardChanges" type="button" disabled>Änderungen verwerfen</button>
    </section>

    <data-status id="statusBox" text="Konfiguration wird geladen."></data-status>
  </main>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="components.js"></script>
  <script src="nethera-select.js"></script>
  <script src="configuration.js?v=20261115-unsaved"></script>
</body>
</html>
