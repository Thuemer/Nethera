<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zeitlimits</title>
  <link rel="icon" href="nethera_logo.png">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="nethera-select.css">
  <link rel="stylesheet" href="time-limits.css?v=20261118-polish2">
  <link rel="stylesheet" href="nethera-theme.css?v=20261119-polish">
  <link rel="stylesheet" href="data-source.css?v=20261119-polish">
</head>
<body>
  <main class="page time-limits-page">
    <app-hero title="Internetzeiten" text="Sperrzeiten und tägliches Zeitbudget pro Gerät." button="Neu laden"></app-hero>
    <data-status id="statusBox" role="status" aria-live="polite" text="Lade gespeicherte Internetzeiten ..."></data-status>
    <div class="router-control-strip" role="status" aria-live="polite">
      <span id="routerControlStatus">Routerwirkung wird geprüft ...</span>
      <button id="refreshRouterControl" class="small-btn ghost" type="button">Status prüfen</button>
    </div>

    <section class="grid stats-grid" aria-label="Zeitlimit Kennzahlen">
      <stat-card id="statDevices" label="Geräte" value="—" detail="im Netzwerk"></stat-card>
      <stat-card id="statLimited" label="Eingeschaltete Regeln" value="—" detail="gespeichert"></stat-card>
      <stat-card id="statBlockedSoon" label="Mit Tagesbudget" value="—" detail="gespeichert"></stat-card>
      <stat-card id="statAverage" label="Ø Zeitbudget" value="—" detail="pro limitiertem Gerät"></stat-card>
    </section>

    <section class="grid two-grid">
      <app-card title="Sperrzeit festlegen">
        <form id="limitForm" class="limit-form">
          <label class="field">
            <span>Für welches Gerät?</span>
            <select id="deviceSelect" required></select>
          </label>

          <fieldset class="schedule-presets">
            <legend>Schnell einrichten</legend>
            <div class="schedule-preset-buttons">
              <button type="button" class="small-btn ghost" data-schedule="night" disabled>Nachtruhe <span>21–07 Uhr</span></button>
              <button type="button" class="small-btn ghost" data-schedule="homework" disabled>Lernzeit <span>14–16 Uhr</span></button>
            </div>
          </fieldset>

          <div class="form-row">
            <label class="field"><span>Internet sperren ab</span><input id="blockedFrom" type="time" value="21:00"></label>
            <label class="field"><span>Internet wieder erlauben ab</span><input id="blockedUntil" type="time" value="07:00"></label>
          </div>
          <label class="field"><span>Sperrzeit-Regel</span><select id="limitStatus"><option value="active">Eingeschaltet</option><option value="paused">Ausgeschaltet – keine Zeitsperre</option></select></label>

          <details class="advanced-settings">
            <summary>Zusätzliches Tageslimit &amp; Notiz</summary>
            <label class="field">
              <span>Maximale Internetzeit pro Tag</span>
              <select id="dailyLimit">
                <option value="30">30 Minuten</option>
                <option value="60">1 Stunde</option>
                <option value="120">2 Stunden</option>
                <option value="180">3 Stunden</option>
                <option value="240">4 Stunden</option>
                <option value="0" selected>Unbegrenzt – nur Sperrzeiten</option>
              </select>
            </label>

          <label class="field">
            <span>Notiz</span>
            <input id="limitNote" type="text" maxlength="160" placeholder="z. B. Schultag, Gastgerät, Konsole">
          </label>
          </details>

          <div class="limit-actions">
            <button id="saveLimitButton" class="refresh-btn" type="submit" disabled>Sperrzeit speichern</button>
            <button id="clearLimitButton" class="small-btn ghost" type="button">Regel entfernen</button>
          </div>
        </form>
      </app-card>

      <app-card title="Vorschau der Regel">
        <div id="schedulePreview" class="effect-summary" aria-live="polite"></div>
        <div id="scheduleTimeline" class="schedule-timeline" hidden>
          <div class="timeline-heading"><strong>Tagesablauf</strong><span>Täglich · Zeitzone Wien</span></div>
          <div id="scheduleTrack" class="schedule-track" role="img"></div>
          <div class="timeline-ticks" aria-hidden="true"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>
          <div class="timeline-legend"><span><i class="allowed-swatch"></i>Keine Zeitsperre</span><span><i class="blocked-swatch"></i>Sperrzeit</span></div>
        </div>
          <p class="router-state">Gespeicherte Regeln sind erst mit Routerbestätigung wirksam.</p>
      </app-card>
    </section>

    <app-card title="Gespeicherte Internetzeiten">
      <div class="limit-toolbar">
        <label class="field">
          <span>Suche</span>
          <input id="searchInput" type="search" placeholder="Hostname, IP oder MAC">
        </label>
        <label class="field">
          <span>Ansicht</span>
          <select id="statusFilter">
            <option value="all">Alle Geräte</option>
            <option value="limited">Nur mit Limit</option>
            <option value="unlimited">Ohne Limit</option>
          </select>
        </label>
      </div>

      <div id="limitsList" class="limit-list" aria-live="polite"></div>
    </app-card>

  </main>

  <script src="config.js"></script>
  <script src="api.js?v=20261120-online"></script>
  <script src="components.js"></script>
  <script src="nethera-select.js?v=20261118-polish2"></script>
  <script src="time-limits.js?v=20261122-router-time"></script>
</body>
</html>
