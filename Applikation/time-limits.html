<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zeitlimits</title>
  <link rel="icon" href="nethera_logo.png">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="nethera-select.css">
  <link rel="stylesheet" href="time-limits.css">
  <link rel="stylesheet" href="nethera-theme.css?v=20261012-polish">
</head>
<body>
  <main class="page time-limits-page">
    <app-hero title="Internetzeiten" text="Sperrzeiten und tägliches Zeitbudget pro Gerät." button="Neu laden"></app-hero>
    <data-status id="statusBox" role="status" aria-live="polite" text="Lade gespeicherte Internetzeiten ..."></data-status>

    <section class="grid stats-grid" aria-label="Zeitlimit Kennzahlen">
      <stat-card id="statDevices" label="Geräte" value="0" detail="im Netzwerk"></stat-card>
      <stat-card id="statLimited" label="Aktive Limits" value="0" detail="mit Zeitbeschränkung"></stat-card>
      <stat-card id="statBlockedSoon" label="Heute begrenzt" value="0" detail="mit Tageslimit"></stat-card>
      <stat-card id="statAverage" label="Ø Zeitbudget" value="0 h" detail="pro limitiertem Gerät"></stat-card>
    </section>

    <section class="grid two-grid">
      <app-card title="Sperrzeit festlegen">
        <form id="limitForm" class="limit-form">
          <label class="field">
            <span>Für welches Gerät?</span>
            <select id="deviceSelect" required></select>
          </label>

          <div class="form-row">
            <label class="field"><span>Internet sperren ab</span><input id="blockedFrom" type="time" value="21:00" required></label>
            <label class="field"><span>Internet wieder erlauben ab</span><input id="blockedUntil" type="time" value="07:00" required></label>
          </div>
          <label class="field"><span>Sperrzeit-Regel</span><select id="limitStatus"><option value="active">Eingeschaltet</option><option value="paused">Ausgeschaltet – keine Zeitsperre</option></select></label>

          <details class="advanced-settings">
            <summary>Zusätzliches Tageslimit &amp; Notiz</summary>
            <label class="field">
              <span>Maximale Internetzeit pro Tag</span>
              <select id="dailyLimit">
                <option value="30">30 Minuten</option>
                <option value="60">1 Stunde</option>
                <option value="120">2 Stunden</option>
                <option value="180">3 Stunden</option>
                <option value="240">4 Stunden</option>
                <option value="0" selected>Unbegrenzt – nur Sperrzeiten</option>
              </select>
            </label>

          <input id="usedMinutesToday" type="hidden" value="0">
          <label class="field">
            <span>Notiz</span>
            <input id="limitNote" type="text" placeholder="z. B. Schultag, Gastgerät, Konsole">
          </label>
          </details>

          <div class="limit-actions">
            <button class="refresh-btn" type="submit">Sperrzeit speichern</button>
            <button id="clearLimitButton" class="small-btn ghost" type="button">Regel entfernen</button>
          </div>
        </form>
      </app-card>

      <app-card title="Vorschau der Regel">
        <div id="schedulePreview" class="effect-summary" aria-live="polite"></div>
        <p class="router-state">Änderungen gelten erst nach dem Speichern. Die Ausführung auf dem Router ist noch nicht bestätigt.</p>
      </app-card>
    </section>

    <app-card title="Gespeicherte Internetzeiten">
      <div class="limit-toolbar">
        <label class="field">
          <span>Suche</span>
          <input id="searchInput" type="search" placeholder="Hostname, IP oder MAC">
        </label>
        <label class="field">
          <span>Ansicht</span>
          <select id="statusFilter">
            <option value="all">Alle Geräte</option>
            <option value="limited">Nur mit Limit</option>
            <option value="unlimited">Ohne Limit</option>
          </select>
        </label>
      </div>

      <div id="limitsList" class="limit-list" aria-live="polite"></div>
    </app-card>

  </main>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="components.js"></script>
  <script src="nethera-select.js"></script>
  <script src="time-limits.js?v=20261011-ux"></script>
</body>
</html>
