# Datenbank-Einstellungen
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/nethera
quarkus.datasource.username=nethera
quarkus.datasource.password=nethera

# ORM / Schema-Generierung (dev-friendly)
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.sql-load-script=import_extended.sql

# OIDC / Keycloak
quarkus.oidc.auth-server-url=http://localhost:8081/realms/Nethera
quarkus.oidc.client-id=nethera-frontend
quarkus.oidc.application-type=service
# Every REST endpoint without its own security annotation requires a logged-in user.
# Public endpoints must opt out explicitly with @PermitAll.
quarkus.security.jaxrs.default-roles-allowed=**

nethera.router.ip=192.168.1.1
nethera.router.ssh-key-path=/Users/tobi/.ssh/id_ed25519_router
nethera.router.wan-interface=wan
nethera.sync.interval=60s

# Telemetry transport: ssh | mqtt | auto (auto = MQTT where fresh, SSH fallback per stream)
nethera.telemetry.mode=auto
# Router that nethera.router.ip / ssh-key-path belong to
nethera.router.id=1

# MQTT broker (Compose sets NETHERA_MQTT_* env vars)
nethera.mqtt.host=localhost
nethera.mqtt.port=1883
nethera.mqtt.username=nethera-backend
nethera.mqtt.password=nethera-backend
nethera.mqtt.stale-after=180s

# One subscription for status + all telemetry streams of every router.
# Disabled automatically when nethera.telemetry.mode=ssh (TelemetryModeConfigInterceptor).
mp.messaging.incoming.router-telemetry.connector=smallrye-mqtt
mp.messaging.incoming.router-telemetry.topic=nethera/#
mp.messaging.incoming.router-telemetry.qos=1
mp.messaging.incoming.router-telemetry.host=${nethera.mqtt.host}
mp.messaging.incoming.router-telemetry.port=${nethera.mqtt.port}
mp.messaging.incoming.router-telemetry.username=${nethera.mqtt.username}
mp.messaging.incoming.router-telemetry.password=${nethera.mqtt.password}
mp.messaging.incoming.router-telemetry.client-id=nethera-backend
mp.messaging.incoming.router-telemetry.auto-generated-client-id=false
mp.messaging.incoming.router-telemetry.auto-clean-session=false
mp.messaging.incoming.router-telemetry.reconnect-interval-seconds=5
mp.messaging.incoming.router-telemetry.max-message-size=65536
mp.messaging.incoming.router-telemetry.failure-strategy=ignore
