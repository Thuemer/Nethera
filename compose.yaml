services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: nethera
      POSTGRES_USER: nethera
      POSTGRES_PASSWORD: ${NETHERA_DB_PASSWORD:-nethera}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nethera -d nethera"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak-postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${NETHERA_KEYCLOAK_DB_PASSWORD:-keycloak}
    volumes:
      - keycloak-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${NETHERA_KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${NETHERA_KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${NETHERA_KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./Applikation/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./themes/nethera:/opt/keycloak/themes/nethera:ro
    depends_on:
      keycloak-postgres:
        condition: service_healthy

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/docker-entrypoint-nethera.sh"]
    environment:
      NETHERA_MQTT_BACKEND_PASSWORD: ${NETHERA_MQTT_BACKEND_PASSWORD:-nethera-backend}
      NETHERA_MQTT_ROUTER1_PASSWORD: ${NETHERA_MQTT_ROUTER1_PASSWORD:-nethera-router}
    ports:
      # Not bound to 127.0.0.1: the router on the LAN has to reach the broker
      - "1883:1883"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./docker/mosquitto/acl:/mosquitto/config/acl:ro
      - ./docker/mosquitto/entrypoint.sh:/docker-entrypoint-nethera.sh:ro
      - mosquitto-data:/mosquitto/data

  backend:
    build: ./Backend/Nethera
    restart: unless-stopped
    environment:
      QUARKUS_HTTP_HOST: 0.0.0.0
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/nethera
      QUARKUS_DATASOURCE_USERNAME: nethera
      QUARKUS_DATASOURCE_PASSWORD: ${NETHERA_DB_PASSWORD:-nethera}
      QUARKUS_HIBERNATE_ORM_DATABASE_GENERATION: update
      QUARKUS_HIBERNATE_ORM_SQL_LOAD_SCRIPT: no-file
      QUARKUS_OIDC_AUTH_SERVER_URL: http://keycloak:8080/realms/Nethera
      QUARKUS_OIDC_TOKEN_ISSUER: http://localhost:8081/realms/Nethera
      QUARKUS_OIDC_CONNECTION_DELAY: 60S
      QUARKUS_SCHEDULER_ENABLED: "false"
      NETHERA_TELEMETRY_MODE: mqtt
      NETHERA_MQTT_HOST: mosquitto
      NETHERA_MQTT_PORT: "1883"
      NETHERA_MQTT_USERNAME: nethera-backend
      NETHERA_MQTT_PASSWORD: ${NETHERA_MQTT_BACKEND_PASSWORD:-nethera-backend}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      mosquitto:
        condition: service_started

  seed:
    image: postgres:15
    environment:
      PGPASSWORD: ${NETHERA_DB_PASSWORD:-nethera}
    volumes:
      - ./docker/seed.sql:/seed.sql:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        until [ "$$(psql -h postgres -U nethera -d nethera -tAc "select to_regclass('public.router') is not null" 2>/dev/null)" = t ]; do sleep 2; done
        psql -v ON_ERROR_STOP=1 -h postgres -U nethera -d nethera -f /seed.sql
    depends_on:
      backend:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: Applikation/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:5500:80"
    depends_on:
      backend:
        condition: service_started
      keycloak:
        condition: service_started

volumes:
  pgdata:
  keycloak-pgdata:
  mosquitto-data:
